version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-packages:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # stay on Python 3.13: only patch releases of the base image
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
